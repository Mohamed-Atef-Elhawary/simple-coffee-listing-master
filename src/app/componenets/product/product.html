<div class="bg-[#1B1D1F] p-[40px] overflow-hidden">
  <!-- <div class="bg-red-200"> -->
  <section class="w-full mx-auto flex flex-col gap-4 py-6 text-center relative sm:w-[500px]">
    <h1 class="text-[2rem] font-bold text-[#FEF7EE]">Our Collection</h1>
    <p class="text-[14px] sm:text-[1rem] text-[#6F757C]">
      Introducing our Coffee Collection, a selection of unique coffees from different roast types
      and origins, expertly roasted in small batches and shipped fresh weekly.
    </p>
    <div class="flex justify-center gap-2 text-[14px] sm:text-[1rem] text-[#FEF7EE]">
      <button
        [ngClass]="status() === 'All' ? 'bg-[#4D5562]' : 'bg-transparent'"
        class="p-1 rounded-lg"
        (click)="setAll()"
      >
        All Products
      </button>
      <button
        [ngClass]="status() === 'Available' ? 'bg-[#4D5562]' : 'bg-transparent'"
        class="p-1 rounded-lg"
        (click)="setAvailable()"
      >
        Available Now
      </button>
    </div>
    <div class="absolute right-[-100px] top-[-40px] sm:right-[0] sm:top-[0] text-white">
      <img class="invert-[0.1] sepia-[1]" src="vector.svg" alt="" />
    </div>
  </section>
  <app-card [status]="status()"></app-card>
</div>
